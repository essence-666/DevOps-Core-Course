apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-app
  namespace: argocd
  labels:
    app: go-app
    environment: default
spec:
  project: default
  source:
    repoURL: https://github.com/essence-666/DevOps-Core-Course.git
    targetRevision: master
    path: k8s/app-go
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
