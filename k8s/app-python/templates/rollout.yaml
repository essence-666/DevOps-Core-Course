{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "app-python.fullname" . }}
  labels:
    {{- include "app-python.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "app-python.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app-python.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.initContainers.enabled }}
      initContainers:
        - name: init-download
          image: busybox:1.36
          command: ['sh', '-c', 'wget -O /work-dir/index.html https://example.com && echo "Download complete"']
          volumeMounts:
            - name: workdir
              mountPath: /work-dir
        - name: wait-for-service
          image: busybox:1.36
          command: ['sh', '-c', 'until nslookup {{ include "app-python.fullname" . }}; do echo "Waiting for service..."; sleep 2; done; echo "Service is ready"']
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "app-python.fullname" . }}-secret
            - configMapRef:
                name: {{ include "app-python.fullname" . }}-env
          env:
            {{- include "app-python.envVars" . | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /config
            {{- if .Values.persistence.enabled }}
            - name: data-volume
              mountPath: /data
            {{- end }}
            {{- if .Values.initContainers.enabled }}
            - name: workdir
              mountPath: /init-data
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "app-python.fullname" . }}-config
        {{- if .Values.persistence.enabled }}
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "app-python.fullname" . }}-data
        {{- end }}
        {{- if .Values.initContainers.enabled }}
        - name: workdir
          emptyDir: {}
        {{- end }}
  strategy:
    {{- if eq .Values.rollout.strategy "canary" }}
    canary:
      steps:
        {{- if .Values.rollout.analysis.enabled }}
        - setWeight: 20
        - analysis:
            templates:
              - templateName: {{ include "app-python.fullname" . }}-success-rate
        - setWeight: 40
        - pause:
            duration: "30s"
        - setWeight: 60
        - pause:
            duration: "30s"
        - setWeight: 80
        - pause:
            duration: "30s"
        {{- else }}
        {{- toYaml .Values.rollout.canary.steps | nindent 8 }}
        {{- end }}
    {{- else if eq .Values.rollout.strategy "blueGreen" }}
    blueGreen:
      activeService: {{ include "app-python.fullname" . }}
      previewService: {{ include "app-python.fullname" . }}-preview
      autoPromotionEnabled: {{ .Values.rollout.blueGreen.autoPromotionEnabled }}
      {{- if .Values.rollout.blueGreen.autoPromotionSeconds }}
      autoPromotionSeconds: {{ .Values.rollout.blueGreen.autoPromotionSeconds }}
      {{- end }}
    {{- end }}
{{- end }}
