apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app-python.fullname" . }}-secret
  labels:
    {{- include "app-python.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  APP_DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
