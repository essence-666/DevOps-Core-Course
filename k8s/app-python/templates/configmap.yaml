{{- /*
ConfigMap 1: File-based configuration (mounted as /config/config.json)
ConfigMap 2: Environment variable configuration (injected as env vars)
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app-python.fullname" . }}-config
  labels:
    {{- include "app-python.labels" . | nindent 4 }}
data:
  config.json: |-
{{ .Files.Get "files/config.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app-python.fullname" . }}-env
  labels:
    {{- include "app-python.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.environment | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  VISITS_FILE: {{ .Values.persistence.visitsFile | quote }}
