{{- if and .Values.rollout.enabled .Values.rollout.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "app-python.fullname" . }}-success-rate
  labels:
    {{- include "app-python.labels" . | nindent 4 }}
spec:
  metrics:
    - name: health-check
      provider:
        web:
          url: "http://{{ include "app-python.fullname" . }}.{{ .Release.Namespace }}.svc/health"
          jsonPath: "{$.status}"
      successCondition: result == "ok"
      interval: 10s
      count: 3
      failureLimit: 1
{{- end }}
