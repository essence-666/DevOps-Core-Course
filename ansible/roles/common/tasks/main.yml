---
- name: Install and configure common packages
  become: true
  tags:
    - packages

  block:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install common packages
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present

    - name: Set timezone
      community.general.timezone:
        name: "{{ common_timezone }}"

  rescue:

    - name: Fix apt cache and retry
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

  always:

    - name: Log package block completion
      ansible.builtin.file:
        path: /tmp/common_packages_done.log
        state: touch
        mode: '0644'


- name: Create system users
  become: true
  tags:
    - users
  block:

    - name: Ensure devops user exists
      ansible.builtin.user:
        name: "{{ common_devops_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
        state: present

  always:

    - name: Log user block completion
      ansible.builtin.file:
        path: /tmp/common_users_done.log
        state: touch
        mode: '0644'
