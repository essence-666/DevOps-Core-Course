---
# Wipe logic runs first (when explicitly requested)
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

- name: Deploy application with Docker Compose
  block:

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: '0755'

    - name: Template docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Deploy application via Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ compose_project_dir }}"

  rescue:

    - name: Log deployment failure
      ansible.builtin.debug:
        msg: "Docker Compose deployment failed!"

  tags:
    - web_app_deploy
    - compose